<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Inicial</title>
    
    <!-- Carregamento do Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Inter para leitura limpa e confortável -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Configuração do Tailwind com a fonte Inter -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<!-- Fundo 100% preto (#000000) para conforto visual e alto contraste suave -->
<body class="bg-[#000000] text-zinc-200 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Container principal centralizado -->
    <main class="w-full max-w-2xl mx-auto flex flex-col items-center">
        
        <!-- Cabeçalho Minimalista -->
        <header class="text-center mb-8 sm:mb-10 w-full">
            <!-- Pequeno indicador discreto de status/destaque -->
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900/90 border border-zinc-800/80 text-xs font-medium text-zinc-400 mb-4">
                <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                <span>Acesso Rápido</span>
            </div>
            
            <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-zinc-100">
                Central de Ferramentas
            </h1>
            <p class="text-sm sm:text-base text-zinc-500 mt-2">
                Selecione uma opção abaixo para continuar
            </p>
        </header>

        <!-- =====================================================================
             GRADE DE BOTÕES
             Para adicionar um novo botão: copie um bloco <a>...</a> abaixo e cole
             dentro desta <section>. Ajuste o atributo href="" e os textos.
             ===================================================================== -->
        <section aria-label="Menu de Navegação" class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4">

            <!-- BOTÃO 1 (PRINCIPAL): Mensagens Padrões -> padroes.html -->
            <a href="padroes.html" 
               class="group relative flex items-center justify-between p-4 sm:p-5 rounded-2xl bg-[#0a0a0a] border border-zinc-800/90 hover:bg-[#111113] hover:border-indigo-500/60 active:scale-[0.99] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
                <div class="flex items-center gap-4">
                    <!-- Ícone em destaque sutil -->
                    <div class="flex items-center justify-center w-11 h-11 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 group-hover:bg-indigo-500/20 group-hover:text-indigo-300 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-base font-medium text-zinc-100 group-hover:text-white transition-colors">
                            Mensagens Padrões
                        </h2>
                        <p class="text-xs text-zinc-500 mt-0.5">
                            Respostas rápidas e modelos
                        </p>
                    </div>
                </div>
                <!-- Seta indicativa -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-600 group-hover:text-indigo-400 group-hover:translate-x-0.5 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <!-- BOTÃO 2 (EXEMPLO): Atendimento -> Altere o href para o arquivo desejado -->
            <a href="#atendimento" 
               onclick="avisarLinkExemplo(event, 'Atendimento')"
               class="group relative flex items-center justify-between p-4 sm:p-5 rounded-2xl bg-[#0a0a0a] border border-zinc-800/90 hover:bg-[#111113] hover:border-zinc-700 active:scale-[0.99] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-600/40">
                <div class="flex items-center gap-4">
                    <div class="flex items-center justify-center w-11 h-11 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 group-hover:text-zinc-200 group-hover:border-zinc-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-base font-medium text-zinc-200 group-hover:text-white transition-colors">
                            Atendimento
                        </h2>
                        <p class="text-xs text-zinc-500 mt-0.5">
                            Suporte e chamados
                        </p>
                    </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-700 group-hover:text-zinc-400 group-hover:translate-x-0.5 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <!-- BOTÃO 3 (EXEMPLO): Relatórios -> Altere o href para o arquivo desejado -->
            <a href="vigias.html" 
               onclick="avisarLinkExemplo(event, 'Relatórios')"
               class="group relative flex items-center justify-between p-4 sm:p-5 rounded-2xl bg-[#0a0a0a] border border-zinc-800/90 hover:bg-[#111113] hover:border-zinc-700 active:scale-[0.99] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-600/40">
                <div class="flex items-center gap-4">
                    <div class="flex items-center justify-center w-11 h-11 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 group-hover:text-zinc-200 group-hover:border-zinc-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-base font-medium text-zinc-200 group-hover:text-white transition-colors">
                            Vigias
                        </h2>
                        <p class="text-xs text-zinc-500 mt-0.5">
                            Métricas e histórico
                        </p>
                    </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-700 group-hover:text-zinc-400 group-hover:translate-x-0.5 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <!-- BOTÃO 4 (EXEMPLO): Configurações -> Altere o href para o arquivo desejado -->
            <a href="#configuracoes" 
               onclick="avisarLinkExemplo(event, 'Configurações')"
               class="group relative flex items-center justify-between p-4 sm:p-5 rounded-2xl bg-[#0a0a0a] border border-zinc-800/90 hover:bg-[#111113] hover:border-zinc-700 active:scale-[0.99] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-600/40">
                <div class="flex items-center gap-4">
                    <div class="flex items-center justify-center w-11 h-11 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 group-hover:text-zinc-200 group-hover:border-zinc-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-base font-medium text-zinc-200 group-hover:text-white transition-colors">
                            Configurações
                        </h2>
                        <p class="text-xs text-zinc-500 mt-0.5">
                            Preferências do sistema
                        </p>
                    </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-700 group-hover:text-zinc-400 group-hover:translate-x-0.5 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <!-- =====================================================================
                 MODELO PARA NOVO BOTÃO (Descomente o bloco abaixo para usar)
                 =====================================================================
            <a href="nova-pagina.html" 
               class="group relative flex items-center justify-between p-4 sm:p-5 rounded-2xl bg-[#0a0a0a] border border-zinc-800/90 hover:bg-[#111113] hover:border-zinc-700 active:scale-[0.99] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-600/40">
                <div class="flex items-center gap-4">
                    <div class="flex items-center justify-center w-11 h-11 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 group-hover:text-zinc-200 group-hover:border-zinc-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-base font-medium text-zinc-200 group-hover:text-white transition-colors">
                            Título do Botão
                        </h2>
                        <p class="text-xs text-zinc-500 mt-0.5">
                            Descrição curta aqui
                        </p>
                    </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-700 group-hover:text-zinc-400 group-hover:translate-x-0.5 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </a>
            ===================================================================== -->

        </section>

        <!-- Rodapé discreto -->
        <footer class="mt-10 text-center">
            <p class="text-xs text-zinc-600">
                Modo Escuro • Conforto Visual
            </p>
        </footer>

    </main>

    <!-- Notificação discreta (Toast) para botões de exemplo que ainda não têm página vinculada -->
    <div id="toast-aviso" role="status" aria-live="polite" class="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs sm:text-sm shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2.5">
        <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
        <span id="toast-texto">Link de exemplo</span>
    </div>

    <script>
        /**
         * Exibe um aviso discreto ao clicar nos botões de exemplo (#)
         * Remova o atributo onclick="" do botão quando colocar um link .html real.
         */
        let toastTimeout;
        function avisarLinkExemplo(event, nomeBotao) {
            const href = event.currentTarget.getAttribute('href');
            if (href && href.startsWith('#')) {
                event.preventDefault();
                const toast = document.getElementById('toast-aviso');
                const texto = document.getElementById('toast-texto');
                
                texto.textContent = `Botão "${nomeBotao}" (edite o href no HTML para vincular uma página)`;
                toast.classList.remove('opacity-0', 'translate-y-2');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'translate-y-2');
                }, 3200);
            }
        }
    </script>
</body>
</html>
